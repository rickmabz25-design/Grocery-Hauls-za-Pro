name: Catalogue extractor checks

on:
  push:
    branches:
      - feature/boxer-catalogue-extractor
  pull_request:
    branches:
      - feature/manual-flyer-product-price-review

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build static preview (no deployment)
        run: npm run build:static
        env:
          NEXT_PUBLIC_STATIC: '1'
