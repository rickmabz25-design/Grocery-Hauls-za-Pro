name: V15 local-only checks

on:
  push:
    branches:
      - restore/v15-phase2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test import review helpers
        run: bun scripts/test-import.ts

      - name: Test browser-local shopping data
        run: bun scripts/test-static-data.ts

      - name: TypeScript check
        run: npm run typecheck
